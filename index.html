<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algo</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
        }

        header {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header img {
            display: block;
            margin: 0 auto;
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 0;
        }

        section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        section div {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .divCards {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .card {
            display: flex;
            justify-content: center;
        }

        button {
            margin: 5px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Primeiro projeto </h1>
        <img src="https://github.com/Scottnessel/teste-kaique/blob/main/cristiano.jpg?raw=true" style="width: 500px; height: auto;" alt="logotipo">
        <nav>
            <ul>
                <li>Inicio </li>
                 <li>Serviços </li>
                  <li>Trabalhos </li>
            </ul>
        </nav>
    </header>
<!-- SEÇÃO 1-->
    <section>
             <h2>HTML + CSS</h2>
        <div>
            <h1>Kaique Honório</h1>
            <p> A 100 anos no mercado</p>
        </div>
        <div>
            <button> Orçamento gratuito <img src="assets/seta" alt=""></button>
             <button> Entrar em contato</button>
        </div>
    </section>

    <!-- SEÇÃO 2-->
     <section>
        <h2>Serviços</h2>
        <div class="divCards">
            <div class="card">
                <img src="assets/twitch icon.jpg" alt="">
            </div>
        </div>
     </section>
</body>
</html>
